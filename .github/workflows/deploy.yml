name: Deploy to OVH

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Simulate the deploy without uploading anything'
        type: boolean
        default: false

# One deploy at a time: two concurrent mirrors of the same directory would
# race on uploads and deletions.
concurrency:
  group: deploy-ovh
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check required secrets
        env:
          FTP_SERVER: ${{ secrets.OVH_FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.OVH_FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.OVH_FTP_PASSWORD }}
        run: |
          missing=""
          [ -z "$FTP_SERVER" ] && missing="$missing OVH_FTP_SERVER"
          [ -z "$FTP_USERNAME" ] && missing="$missing OVH_FTP_USERNAME"
          [ -z "$FTP_PASSWORD" ] && missing="$missing OVH_FTP_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secret(s):$missing"
            echo "Add them in Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test -- --watch=false

      - name: Build production bundle
        run: npm run build

      - name: Verify build output
        run: |
          test -f dist/cv-site/browser/index.html
          test -f dist/cv-site/browser/.htaccess
          ls -la dist/cv-site/browser

      # OVHcloud shared hosting does not implement explicit FTPS (AUTH TLS is
      # answered with "500 This security scheme is not implemented"), so the
      # upload goes over SFTP. Only the main FTP user has SSH/SFTP access.
      - name: Install lftp
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends lftp

      - name: Trust the host key
        env:
          FTP_SERVER: ${{ secrets.OVH_FTP_SERVER }}
          SFTP_PORT: ${{ vars.OVH_SFTP_PORT || '22' }}
          KNOWN_HOSTS: ${{ secrets.OVH_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          if [ -n "$KNOWN_HOSTS" ]; then
            printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            echo "::warning::OVH_SSH_KNOWN_HOSTS is not set; trusting the key the server presents now."
            ssh-keyscan -p "$SFTP_PORT" -H "$FTP_SERVER" > ~/.ssh/known_hosts
          fi
          chmod 600 ~/.ssh/known_hosts
          test -s ~/.ssh/known_hosts

      - name: Deploy over SFTP
        env:
          FTP_SERVER: ${{ secrets.OVH_FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.OVH_FTP_USERNAME }}
          LFTP_PASSWORD: ${{ secrets.OVH_FTP_PASSWORD }}
          SFTP_PORT: ${{ vars.OVH_SFTP_PORT || '22' }}
          SERVER_DIR: ${{ vars.OVH_FTP_SERVER_DIR || 'www/' }}
          DRY_RUN: ${{ inputs.dry_run == true }}
        run: |
          set -euo pipefail
          mirror_flags="--reverse --delete --no-perms --parallel=4 --verbose"
          if [ "$DRY_RUN" = "true" ]; then
            echo "Dry run: listing what would change, uploading nothing."
            mirror_flags="$mirror_flags --dry-run"
          fi
          script="$RUNNER_TEMP/deploy.lftp"
          umask 077
          cat > "$script" <<EOF
          set cmd:fail-exit yes
          set net:max-retries 3
          set net:timeout 20s
          set sftp:auto-confirm no
          set sftp:connect-program "ssh -a -x -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts"
          open -u "$FTP_USERNAME" --env-password -p "$SFTP_PORT" sftp://$FTP_SERVER
          mirror $mirror_flags ./dist/cv-site/browser/ "$SERVER_DIR"
          bye
          EOF
          trap 'rm -f "$script"' EXIT
          lftp -f "$script"
