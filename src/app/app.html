<div class="scene" [class.is-day]="!isNight()">
  <app-locale-selector
    [currentLocale]="locale()"
    [content]="appShellContent().localeSelector"
    (localeChange)="setLocale($event)"
  />

  <div class="sky" aria-hidden="true" [style.--scroll-shift]="scrollShift()">
    <div class="sky__gradient"></div>
    <div class="sky__glow"></div>
    <div class="sky__daylight"></div>
    <div class="sky__nebula sky__nebula--violet"></div>
    <div class="sky__nebula sky__nebula--teal"></div>
    <div class="sky__nebula sky__nebula--rose"></div>
    <div class="sky__stardust"></div>
    <div class="sky__stars sky__stars--far"></div>
    <div class="sky__stars sky__stars--near"></div>

    <div class="sky__clouds">
      @for (cloud of clouds; track $index) {
        <span
          class="cloud"
          [class.cloud--far]="cloud.depth === 'far'"
          [class.cloud--rare]="cloud.rare"
          [class.cloud--rain]="cloud.rain"
          [style.top.%]="cloud.top"
          [style.--cloud-scale]="cloud.scale"
          [style.--cloud-rest]="cloud.rest + '%'"
          [style.animationDelay.s]="cloud.delay"
          [style.animationDuration.s]="cloud.duration"
        >
          <svg class="cloud__art" viewBox="0 0 200 96" [style.animationDelay.s]="cloud.bob">
            <path class="cloud__body" [attr.d]="cloud.art.d" />

            @if (cloud.rain) {
              @for (drop of raindrops; track $index) {
                <g [attr.transform]="'translate(' + drop.x + ',90)'">
                  <path
                    class="cloud__drop"
                    [attr.d]="raindropPath"
                    [style.animationDelay.s]="drop.delay"
                  />
                </g>
              }
            }

            <g class="cloud__face" [attr.transform]="'translate(' + cloud.art.faceAt + ')'">
              <ellipse class="cloud__blush" cx="-23" cy="4" rx="6" ry="3.6" />
              <ellipse class="cloud__blush" cx="23" cy="4" rx="6" ry="3.6" />
              @if (cloud.face.brows) {
                <path class="cloud__brows" [attr.d]="cloud.face.brows" />
              }
              @if (cloud.face.lids) {
                <path class="cloud__lids" [attr.d]="cloud.face.lids" />
              }
              @if (cloud.face.eyes) {
                <path
                  class="cloud__eyes"
                  [attr.d]="cloud.face.eyes"
                  [attr.stroke-width]="cloud.face.eyeWidth"
                />
              }
              <path
                class="cloud__mouth"
                [class.cloud__mouth--filled]="cloud.face.mouthFilled"
                [attr.d]="cloud.face.mouth"
              />
            </g>
          </svg>
        </span>
      }
    </div>

    <app-celestial-body [class.is-day]="!isNight()" />

    @for (star of heroStars; track $index) {
      <span
        class="star"
        [class.star--glint]="star.variant === 'glint'"
        [class.star--drift]="star.variant === 'drift'"
        [style.top.%]="star.top"
        [style.left.%]="star.left"
        [style.width.px]="star.size"
        [style.height.px]="star.size"
        [style.animationDelay.s]="star.delay"
        [style.animationDuration.s]="star.duration"
      ></span>
    }

    @for (shootingStar of shootingStars; track $index) {
      <span
        class="shooting-star"
        [style.top.%]="shootingStar.top"
        [style.left.%]="shootingStar.left"
        [style.animationDelay.s]="shootingStar.delay"
        [style.animationDuration.s]="shootingStar.duration"
        [style.--fly-x.px]="shootingStar.dx"
        [style.--fly-y.px]="shootingStar.dy"
        [style.--trail-angle.deg]="shootingStar.trailAngle"
      ></span>
    }

    <div class="sky__birds">
      @for (flock of flocks; track $index) {
        <span
          class="bird-flock"
          [style.top.%]="flock.top"
          [style.--flock-rest]="flock.rest + '%'"
          [style.animationDelay.s]="flock.delay"
          [style.animationDuration.s]="flock.duration"
        >
          @for (bird of flock.members; track $index) {
            <span
              class="bird"
              [style.left.px]="bird.dx"
              [style.top.px]="bird.dy"
              [style.--bird-w.px]="bird.width"
              [style.--bird-flap]="bird.flap + 's'"
              [style.--bird-flap-shift]="bird.flapShift + 's'"
              [style.animationDelay.s]="bird.soar"
            >
              <svg class="bird__art" viewBox="-3 -3 106 82">
                <path class="bird__beak" d="M74 31L94 36L74 43Z" />
                <path
                  class="bird__body"
                  d="M2 14C16 26 26 30 38 30C46 20 64 19 73 29C81 37 78 46 68 50C56 55 38 54 28 47C18 40 8 28 2 14Z"
                />
                <path
                  class="bird__wing bird__wing--up"
                  d="M42 32C38 18 44 4 56 0C61 12 57 28 51 37Z"
                />
                <path
                  class="bird__wing bird__wing--mid"
                  d="M44 30C38 23 32 19 23 19C27 27 35 35 47 37Z"
                />
                <path
                  class="bird__wing bird__wing--down"
                  d="M44 33C41 48 44 63 53 71C60 59 57 44 53 36Z"
                />
                <circle class="bird__eye" cx="64" cy="31" r="3.1" />
              </svg>
            </span>
          }
        </span>
      }
    </div>

    <div class="sky__hills">
      <svg class="hill hill--far" viewBox="0 0 1200 120" preserveAspectRatio="none">
        <path
          d="M-20 130L-20 42C70 28 130 20 200 23C280 26 330 42 410 45C490 48 545 30 620 24C700 18 760 30 830 39C900 48 960 44 1030 35C1100 26 1160 28 1220 35L1220 130Z"
        />
      </svg>
      <svg class="hill hill--mid" viewBox="0 0 1200 120" preserveAspectRatio="none">
        <path
          d="M-20 130L-20 48C90 37 170 30 270 35C380 41 450 55 560 57C670 59 740 43 850 40C950 37 1030 48 1110 53C1150 56 1190 54 1220 51L1220 130Z"
        />
      </svg>
      <svg class="hill hill--near" viewBox="0 0 1200 120" preserveAspectRatio="none">
        <path
          d="M-20 130L-20 50C120 39 210 46 330 51C450 56 540 43 660 41C780 39 860 51 970 55C1070 59 1150 53 1220 48L1220 130Z"
        />
      </svg>
    </div>
  </div>

  <button
    type="button"
    class="theme-toggle"
    role="switch"
    [attr.aria-checked]="!isNight()"
    [attr.aria-label]="appShellContent().themeToggleAriaLabel"
    (click)="toggleTheme()"
  >
    <span class="theme-toggle__track" aria-hidden="true"></span>
    <span class="theme-toggle__thumb" aria-hidden="true"></span>
  </button>

  <main class="page">
    <app-hero-section [content]="heroContent()" />

    <div class="divider" aria-hidden="true"><span>✦</span></div>

    <app-about-section [content]="aboutContent()" />

    <div class="divider" aria-hidden="true"><span>✦</span></div>

    <app-experience-section [content]="experienceContent()" />

    <div class="divider" aria-hidden="true"><span>✦</span></div>

    <app-education-section [content]="educationContent()" />

    <div class="divider" aria-hidden="true"><span>✦</span></div>

    <app-skills-section [content]="skillsContent()" />

    <div class="divider" aria-hidden="true"><span>✦</span></div>

    <app-games-section [content]="gamesContent()" />

    <app-footer-section [content]="footerContent()" />
  </main>
</div>
