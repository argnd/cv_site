<div class="scene" [class.is-day]="!isNight()">
  <app-locale-selector
    [currentLocale]="locale()"
    [content]="appShellContent().localeSelector"
    (localeChange)="setLocale($event)"
  />

  <div class="sky" aria-hidden="true" [style.--scroll-shift]="scrollShift()">
    <div class="sky__gradient"></div>
    <div class="sky__glow"></div>
    <div class="sky__daylight"></div>
    <div class="sky__nebula sky__nebula--violet"></div>
    <div class="sky__nebula sky__nebula--teal"></div>
    <div class="sky__nebula sky__nebula--rose"></div>
    <div class="sky__stardust"></div>
    <div class="sky__stars sky__stars--far"></div>
    <div class="sky__stars sky__stars--near"></div>

    <div class="sky__clouds">
      @for (cloud of clouds; track $index) {
        <span
          class="cloud"
          [class.cloud--far]="cloud.depth === 'far'"
          [style.top.%]="cloud.top"
          [style.--cloud-scale]="cloud.scale"
          [style.--cloud-rest]="cloud.rest + '%'"
          [style.animationDelay.s]="cloud.delay"
          [style.animationDuration.s]="cloud.duration"
        >
          <svg class="cloud__art" viewBox="0 0 200 96" [style.animationDelay.s]="cloud.bob">
            <path class="cloud__body" [attr.d]="cloud.art.d" />
            <g class="cloud__face" [attr.transform]="'translate(' + cloud.art.faceAt + ')'">
              <ellipse class="cloud__blush" cx="-23" cy="4" rx="6" ry="3.6" />
              <ellipse class="cloud__blush" cx="23" cy="4" rx="6" ry="3.6" />
              <path class="cloud__eyes" [attr.d]="cloud.face.eyes" [attr.stroke-width]="cloud.face.eyeWidth" />
              <path
                class="cloud__mouth"
                [class.cloud__mouth--filled]="cloud.face.mouthFilled"
                [attr.d]="cloud.face.mouth"
              />
            </g>
          </svg>
        </span>
      }
    </div>

    <app-celestial-body [class.is-day]="!isNight()" />

    @for (star of heroStars; track $index) {
      <span
        class="star"
        [class.star--glint]="star.variant === 'glint'"
        [class.star--drift]="star.variant === 'drift'"
        [style.top.%]="star.top"
        [style.left.%]="star.left"
        [style.width.px]="star.size"
        [style.height.px]="star.size"
        [style.animationDelay.s]="star.delay"
        [style.animationDuration.s]="star.duration"
      ></span>
    }

    @for (shootingStar of shootingStars; track $index) {
      <span
        class="shooting-star"
        [style.top.%]="shootingStar.top"
        [style.left.%]="shootingStar.left"
        [style.animationDelay.s]="shootingStar.delay"
        [style.animationDuration.s]="shootingStar.duration"
        [style.--fly-x.px]="shootingStar.dx"
        [style.--fly-y.px]="shootingStar.dy"
        [style.--trail-angle.deg]="shootingStar.trailAngle"
      ></span>
    }

    @for (bird of birds; track $index) {
      <span
        class="bird"
        [style.top.%]="bird.top"
        [style.animationDelay.s]="bird.delay"
        [style.animationDuration.s]="bird.duration"
      >
        <span class="bird__wing bird__wing--left"></span>
        <span class="bird__wing bird__wing--right"></span>
      </span>
    }
  </div>

  <button
    type="button"
    class="theme-toggle"
    role="switch"
    [attr.aria-checked]="!isNight()"
    [attr.aria-label]="appShellContent().themeToggleAriaLabel"
    (click)="toggleTheme()"
  >
    <span class="theme-toggle__track" aria-hidden="true"></span>
    <span class="theme-toggle__thumb" aria-hidden="true"></span>
  </button>

  <main class="page">
    <app-hero-section [content]="heroContent()" />

    <div class="divider" aria-hidden="true"><span>✦</span></div>

    <app-about-section [content]="aboutContent()" />

    <div class="divider" aria-hidden="true"><span>✦</span></div>

    <app-experience-section [content]="experienceContent()" />

    <div class="divider" aria-hidden="true"><span>✦</span></div>

    <app-education-section [content]="educationContent()" />

    <div class="divider" aria-hidden="true"><span>✦</span></div>

    <app-skills-section [content]="skillsContent()" />

    <div class="divider" aria-hidden="true"><span>✦</span></div>

    <app-games-section [content]="gamesContent()" />

    <app-footer-section [content]="footerContent()" />
  </main>
</div>
