<section class="section games" id="games">
  <p class="kicker">{{ content().kicker }}</p>
  <h2>{{ content().title }}</h2>
  <p>{{ content().description }}</p>
  <div *ngFor="let element of content().elements" class="game">
    <h3>{{ element.title }}</h3>
    <p>{{ element.description }}</p>
    <a [href]="element.link" target="_blank" rel="noopener noreferrer">Play</a>
  </div>
  <div class="games__glyph" aria-hidden="true">
    <span></span><span></span><span></span><span></span><span></span>
  </div>
</section>
