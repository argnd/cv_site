<header class="hero" id="top">
  <p class="kicker">{{ content().kicker }}</p>
  <h1 class="hero__name">{{ content().name }}</h1>
  <p class="hero__headline">{{ content().headline }}</p>
  <p class="hero__meta">{{ content().location }}</p>

  <nav class="hero__actions">
    <a class="link-glow" [href]="content().linkedinUrl" target="_blank" rel="noopener noreferrer">
      <span>{{ content().linkedinLabel }}</span>
    </a>
    <a class="link-glow" href="/project" (click)="onProjectsClick($event)"><span>{{ content().gamesLinkLabel }}</span></a>
  </nav>

  <div class="scroll-cue" aria-hidden="true"><span></span></div>
</header>
