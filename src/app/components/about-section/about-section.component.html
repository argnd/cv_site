<section class="section about" id="about">
  <p class="kicker">{{ content().kicker }}</p>
  <h2>{{ content().title }}</h2>
  <div class="about__content about__content--primary" [innerHTML]="content().bodyPrimary"></div>
  @if (content().bodyExpanded) {
    <!-- Rendered whether or not it is open, and hidden with CSS when closed.
         The page has no server render, so this markup is also the only copy a
         crawler can find: behind an `@if` the whole technical-keyword block —
         the most search-relevant prose on the site — simply would not exist in
         the DOM until someone clicked. `display: none` still keeps it out of
         the accessibility tree and off the tab order while collapsed. -->
    <div
      id="about-expanded-content"
      class="about__content about__content--expanded"
      [class.about__content--collapsed]="!isExpanded()"
      [innerHTML]="content().bodyExpanded"
    ></div>
    <button
      type="button"
      class="link-toggle about__toggle"
      [attr.aria-expanded]="isExpanded()"
      aria-controls="about-expanded-content"
      (click)="toggleExpanded()"
    >
      {{ isExpanded() ? content().collapseLabel : content().expandLabel }}
    </button>
  }
  <p class="hero__meta">{{ content().phone }}</p>
  <p class="hero__meta">{{ content().email }}</p>
</section>
