<section class="section education" id="education">
  <p class="kicker">{{ content().kicker }}</p>
  <h2>{{ content().title }}</h2>

  <div class="constellation-list">
    @for (item of content().items; track item.school) {
      <article class="constellation-item">
        <span class="constellation-item__mark" aria-hidden="true">✦</span>
        <div>
          <h3>{{ item.degree }}</h3>
          <p class="hero__meta">{{ item.school }} · {{ item.period }}</p>
          <p>{{ item.details }}</p>
        </div>
      </article>
    }
  </div>
</section>
